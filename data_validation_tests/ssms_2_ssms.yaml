test:
  name: "db to db"
  source:
    type: "ssms"
    connection:
      SERVER: 'SOURCE_SSMS_SERVER'
      DATABASE: 'SOURCE_SSMS_DATABASE'
      USERNAME: 'SOURCE_SSMS_USERNAME'
      PASSWORD: 'SOURCE_SSMS_PASSWORD'
      HOST: 'SOURCE_SSMS_HOST'
      PORT: 'SOURCE_SSMS_PORT'
      query: 'SOURCE_SSMS_QUERY'
  target:
    type: "ssms"
    connection:
      SERVER: 'TARGET_SSMS_SERVER'
      DATABASE: 'TARGET_SSMS_DATABASE'
      USERNAME: 'TARGET_SSMS_USERNAME'
      PASSWORD: 'TARGET_SSMS_PASSWORD'
      HOST: 'TARGET_SSMS_HOST'
      PORT: 'TARGET_SSMS_PORT'
      query: 'TARGET_SSMS_QUERY'
  comparison_rules:
    - equal_row_count
    - rows_match
