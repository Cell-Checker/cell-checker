test:
  name: "simple mysql test"
  source:
    type: "mysql"
    connection:
      host: "localhost"
      port: 3306
      dbname: "test"
      username: "root"
      password: "password"
      query: "SELECT * FROM test_table"
  target:
    type: "mysql"
    connection:
        host: "localhost"
        port: 3306
        dbname: "test"
        username: "root"
        password: "password"
        query: "SELECT * FROM test_table"
  comparison_rules:
    - equal_row_count
    - rows_match
    - not_null
