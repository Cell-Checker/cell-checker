test:
  name: "simple mysql test"
  source:
    type: "mysql"
    connection:
      host: "prd-rds-gen-vpc-ro.cfiljz5yqq5u.us-east-1.rds.amazonaws.com"
      port: "5432"
      dbname: "test"
      query:  'SELECT * FROM public.test'

      # use .env file to store the username & password. Please note that username value (SOURCE_MYSQL_USERNAME) &
      # password value (SOURCE_MYSQL_PASSWORD) in this file should be used as keys in the .env file
      # to store the actual username & password
      username: "SOURCE_MYSQL_USERNAME"
      password: "SOURCE_MYSQL_PASSWORD"

  target:
    type: "mysql"
    connection:
      host: "localhost"
      port: "5432"
      dbname: "test"
      query: 'SELECT * FROM public.test'

      # use .env file to store the username & password. Please note that username value (SOURCE_MYSQL_USERNAME) &
      # password value (SOURCE_MYSQL_PASSWORD) in this file should be used as keys in the .env file
      # to store the actual username & password
      username: "TARGET_MYSQL_USERNAME"
      password: "TARGET_MYSQL_PASSWORD"

  comparison_rules:
    - equal_row_count
    - rows_match
    - not_null
